# Local dependency stack for development — Postgres 16 + Redis 7.
#
# The default build needs NEITHER: `go test ./...` runs on a private SQLite
# database, and `go run ./` creates ./data/placard.db on first start and serves
# without Redis. This file is for the second dialect and the second ephemeral
# state backend:
#
#   make up
#   make test-integration     # the same tests, against Postgres
#
# It does NOT build/run the app: run that locally so code changes need no image
# rebuild. Schema bootstrap needs no SQL init files — internal/migrate builds it.
# The deployment stack is docker-compose.yaml.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placard
      POSTGRES_USER: placard
      POSTGRES_PASSWORD: placard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placard -d placard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: {}
